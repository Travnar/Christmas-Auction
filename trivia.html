<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Christmas Movie Trivia: Christmas Auction</title>
<meta name="description" content="Christmas movie trivia questions and answers for our Christmas Auction.">
<script src="theme.js?v=5"></script>
<link rel="stylesheet" href="style.css?v=11">
</head>
<body>
<canvas id="snow" aria-hidden="true"></canvas>
<div class="lights" id="lights" aria-hidden="true"></div>
<div class="marquee"><span id="marqueeText">&#9733; WELCOME TO THE CHRISTMAS AUCTION &#9733;</span></div>

<header>
  <div class="hero">
    <img src="media/images/tree_art.png" alt="Decorated Christmas tree with presents">
    <div class="mid">
      <h1 class="wordart">Christmas Auction</h1>
    </div>
    <img src="media/images/tree_art.png" alt="Decorated Christmas tree with presents">
  </div>
</header>

<main>
  <section id="trivia">
    <h2>Christmas Movie Trivia</h2>
    <div class="card center">
      <p class="small" id="triviaCount">Press the button to draw a question.</p>
      <p class="tag" id="triviaMovie" hidden></p>
      <p class="trivia-q" id="triviaQ" role="status" aria-live="polite"></p>
      <p class="trivia-a" id="triviaA" hidden></p>
      <p>
        <button id="newBtn" type="button">New question</button>
        <button id="showBtn" type="button" class="alt" hidden>Show answer</button>
      </p>
    </div>
  </section>

  <section class="backbar">
    <h2><a href="rules.html">Back</a></h2>
  </section>
</main>

<script src="firebase-config.js"></script>
<script src="app.js"></script>
<script src="decor.js?v=11"></script>
<script>
/* Christmas movie trivia: each press of "New question" draws the next question from a shuffled deck,
 * so nothing repeats until every question has been asked. */
(function () {
  var QS = [
    ['Home Alone', 'Which city does the McCallister family fly to for Christmas, leaving Kevin behind?', 'Paris, France.'],
    ['Home Alone', 'What are the two burglars known as?', 'The Wet Bandits (Harry and Marv).'],
    ['Home Alone', 'What is the name of the scary neighbor who turns out to be kind?', 'Old Man Marley.'],
    ['Home Alone', 'What is the name of Buzz’s pet tarantula?', 'Axl.'],
    ['Home Alone 2: Lost in New York', 'Which famous New York hotel does Kevin stay at?', 'The Plaza Hotel.'],
    ['Elf', 'Which four food groups does Buddy say elves live on?', 'Candy, candy canes, candy corn and syrup.'],
    ['Elf', 'What does Buddy put on his spaghetti?', 'Maple syrup.'],
    ['Elf', 'What kind of company does Buddy’s dad, Walter Hobbs, work for?', 'A children’s book publisher.'],
    ['Elf', 'What is the name of the department store worker Buddy falls for?', 'Jovie.'],
    ['A Christmas Story', 'What gift does Ralphie want more than anything?', 'A Red Ryder BB gun.'],
    ['A Christmas Story', 'What is the famous warning Ralphie hears from everyone about the BB gun?', '“You’ll shoot your eye out!”'],
    ['A Christmas Story', 'What does Flick get his tongue stuck to after a triple-dog-dare?', 'A frozen flagpole.'],
    ['A Christmas Story', 'What does Ralphie’s father win that he calls “a major award”?', 'A leg lamp.'],
    ['A Christmas Story', 'Where does the Parker family eat Christmas dinner after the neighbors’ hounds eat the turkey?', 'A Chinese restaurant.'],
    ['A Christmas Story', 'What does the secret message from the Little Orphan Annie decoder pin turn out to be?', '“Be sure to drink your Ovaltine.”'],
    ['National Lampoon’s Christmas Vacation', 'What is the Griswold family’s patriarch called?', 'Clark Griswold.'],
    ['National Lampoon’s Christmas Vacation', 'What does Clark expect his Christmas bonus to pay for?', 'A swimming pool.'],
    ['National Lampoon’s Christmas Vacation', 'What does Clark’s boss give employees instead of the Christmas bonus Clark expected?', 'A year’s membership in the Jelly of the Month Club.'],
    ['National Lampoon’s Christmas Vacation', 'What is the name of Clark’s RV-driving cousin by marriage?', 'Cousin Eddie.'],
    ['How the Grinch Stole Christmas', 'What is the name of the Grinch’s dog?', 'Max.'],
    ['How the Grinch Stole Christmas', 'What mountain does the Grinch live on?', 'Mount Crumpit.'],
    ['How the Grinch Stole Christmas', 'What happens to the Grinch’s heart at the end?', 'It grows three sizes.'],
    ['How the Grinch Stole Christmas', 'What is the name of the little Who girl who meets the Grinch?', 'Cindy Lou Who.'],
    ['It’s a Wonderful Life', 'What is the name of the angel who earns his wings by helping George Bailey?', 'Clarence.'],
    ['It’s a Wonderful Life', 'What is the name of George Bailey’s town?', 'Bedford Falls.'],
    ['It’s a Wonderful Life', 'What happens every time a bell rings, according to Zuzu?', 'An angel gets his wings.'],
    ['Die Hard', 'What is the name of the building where John McClane fights Hans Gruber?', 'Nakatomi Plaza.'],
    ['The Polar Express', 'What does the boy get as a gift from Santa that only believers can hear?', 'A bell from Santa’s sleigh.'],
    ['The Polar Express', 'What is served by dancing waiters on the train?', 'Hot chocolate.'],
    ['The Santa Clause', 'What is the name of the character played by Tim Allen?', 'Scott Calvin.'],
    ['The Santa Clause', 'What happens that forces Scott Calvin to take over as Santa?', 'Santa falls off his roof, and Scott puts on the suit.'],
    ['The Nightmare Before Christmas', 'Who is the Pumpkin King of Halloween Town?', 'Jack Skellington.'],
    ['The Nightmare Before Christmas', 'What does Jack call Santa when he decides to take over Christmas?', '“Sandy Claws.”'],
    ['A Charlie Brown Christmas', 'What kind of Christmas tree does Charlie Brown pick?', 'A tiny, scraggly one.'],
    ['A Charlie Brown Christmas', 'Which character recites the Christmas story from the Bible on stage?', 'Linus.'],
    ['Rudolph the Red-Nosed Reindeer', 'What is the name of the place where unwanted toys live?', 'The Island of Misfit Toys.'],
    ['Rudolph the Red-Nosed Reindeer', 'What job does Hermey the elf want instead of toy making?', 'Dentist.'],
    ['Miracle on 34th Street', 'Which department store does Kris Kringle work for?', 'Macy’s.'],
    ['The Muppet Christmas Carol', 'Which actor plays Scrooge?', 'Michael Caine.'],
    ['Love Actually', 'What does the Prime Minister do to the song “Jump (For My Love)”?', 'He dances to it around 10 Downing Street.']
  ];

  var elQ = document.getElementById('triviaQ'), elA = document.getElementById('triviaA'),
      elM = document.getElementById('triviaMovie'), elC = document.getElementById('triviaCount'),
      bNew = document.getElementById('newBtn'), bShow = document.getElementById('showBtn');
  var deck = [], n = 0, current = null;

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1)), t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }
  function draw() {
    if (!deck.length) { deck = shuffle(QS.slice()); n = 0; }
    current = deck.pop(); n++;
    elM.textContent = current[0]; elM.hidden = false;
    elQ.textContent = current[1];
    elA.textContent = current[2]; elA.hidden = true;
    elC.textContent = 'Question ' + n + ' of ' + QS.length;
    bNew.textContent = 'Next question';
    bShow.hidden = false; bShow.textContent = 'Show answer';
  }
  bNew.addEventListener('click', draw);
  bShow.addEventListener('click', function () {
    elA.hidden = !elA.hidden;
    bShow.textContent = elA.hidden ? 'Show answer' : 'Hide answer';
  });
})();
</script>
</body>
</html>
